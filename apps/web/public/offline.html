<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're offline | Esparex</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #020617;
        color: #f8fafc;
      }
      .card {
        background-color: #0f172a !important;
        border-color: #1e293b !important;
      }
      .heading {
        color: #ffffff !important;
      }
      .subtitle {
        color: #94a3b8 !important;
      }
      .icon-badge {
        background-color: rgba(120, 53, 15, 0.3) !important;
        border-color: rgba(146, 64, 14, 0.4) !important;
        color: #fbbf24 !important;
      }
      .btn-secondary {
        background-color: #1e293b !important;
        border-color: #334155 !important;
        color: #e2e8f0 !important;
      }
      .btn-secondary:hover {
        background-color: #334155 !important;
      }
    }
    .card {
      width: 100%;
      max-width: 440px;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1.25rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      padding: 2.5rem 2rem;
      text-align: center;
    }
    .icon-badge {
      width: 64px !important;
      height: 64px !important;
      max-width: 64px !important;
      max-height: 64px !important;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 1rem;
      background-color: #fffbeb;
      border: 1px solid #fde68a;
      color: #d97706;
    }
    .icon-badge svg {
      width: 32px !important;
      height: 32px !important;
      max-width: 32px !important;
      max-height: 32px !important;
    }
    .heading {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.625rem;
      letter-spacing: -0.025em;
      color: #0f172a;
    }
    .subtitle {
      font-size: 0.875rem;
      line-height: 1.5;
      color: #475569;
      margin-bottom: 2rem;
      max-width: 320px;
      margin-left: auto;
      margin-right: auto;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    @media (min-width: 480px) {
      .actions {
        flex-direction: row;
      }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      height: 2.75rem;
      padding: 0 1.25rem;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
      width: 100%;
    }
    .btn svg {
      width: 16px !important;
      height: 16px !important;
      max-width: 16px !important;
      max-height: 16px !important;
      flex-shrink: 0;
    }
    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
    }
    .btn-primary:hover {
      background-color: #1d4ed8;
    }
    .btn-secondary {
      background-color: #ffffff;
      color: #334155;
      border: 1px solid #cbd5e1;
    }
    .btn-secondary:hover {
      background-color: #f1f5f9;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-badge">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1 class="heading">You're offline</h1>
    <p class="subtitle">It looks like you've lost your internet connection. Check your network connection and try again.</p>
    <div class="actions">
      <button class="btn btn-primary" onclick="window.location.reload()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
          <path d="M16 16h5v5"></path>
        </svg>
        <span>Try again</span>
      </button>
      <a href="/" class="btn btn-secondary">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Go to homepage</span>
      </a>
    </div>
  </div>
</body>
</html>
