name: Governance Validation

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Dependencies
        run: npm ci

      - name: Run Repository Gate
        run: npm run repo:gate

      - name: Generate Governance Observability Dashboard Summary
        if: always()
        run: npm run repo:governance-dashboard

      - name: Enforce Governance Health Score Minimum
        run: |
          node -e "
          const fs = require('fs');
          const path = '.governance/latest-run.json';
          if (!fs.existsSync(path)) {
            console.log('No governance run file found at ' + path + ', skipping score check.');
            process.exit(0);
          }
          const run = JSON.parse(fs.readFileSync(path, 'utf8'));
          const score = run.healthScore ?? 100;
          const threshold = 85;
          if (score < threshold) {
            console.error('❌ Governance health score ' + score + '% is below minimum threshold of ' + threshold + '%');
            process.exit(1);
          }
          console.log('✅ Governance health score ' + score + '% meets minimum threshold of ' + threshold + '%');
          "

      - name: Validate Governance Data (Schema, DAG, References)
        run: npm run governance:validate
        
      - name: Check Generated Ledger Snapshot Parity
        run: npm run governance:check
